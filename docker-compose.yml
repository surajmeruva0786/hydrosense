services:
  app:
    build: .
    image: hydrosense:latest
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
